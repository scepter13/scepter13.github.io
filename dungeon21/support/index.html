<p>던전21(Dungeon21) 이용 중 문제가 있거나 궁금한 점이 있으면 이메일로 문의해 주세요.</p>
<p>개발자: SEO DAEGYU (리팩토리 / Refactory)<br>이메일: <a href="mailto:scepter1113@gmail.com">scepter1113@gmail.com</a></p>
<h2>자주 묻는 질문</h2>
<h3>구매한 평생 패스를 복원하려면?</h3>
<p>같은 Apple ID로 로그인된 기기에서 게임의 설정 화면에 있는 <strong>&#x27;구매 복원&#x27;</strong> 버튼을 누르세요. 소모성 패키지는 복원되지 않습니다.</p>
<h3>환불을 받고 싶어요.</h3>
<p>결제는 Apple이 처리하므로 환불은 Apple에 요청해야 합니다: <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a></p>
<h3>기기를 바꾸면 진행 상황이 옮겨지나요?</h3>
<p>아니요. 진행 데이터는 기기 안에만 저장되며 iCloud·Game Center를 쓰지 않으므로 다른 기기로 옮길 수 없습니다. 앱을 삭제하면 진행 상황도 지워집니다. 평생 패스는 &#x27;구매 복원&#x27;으로 다시 받을 수 있습니다.</p>
<h3>광고가 나오지 않아요.</h3>
<p>인터넷 연결을 확인하고 잠시 후 다시 시도해 주세요. 지역이나 시간에 따라 보여줄 광고가 일시적으로 없을 수 있습니다. 평생 패스를 보유하면 광고 버튼이 표시되지 않습니다.</p>
<h3>언어를 바꾸고 싶어요.</h3>
<p>게임 언어는 기기의 언어 설정을 따릅니다.</p>

<h2>FAQ</h2>
<h3>How do I restore my Lifetime Pass?</h3>
<p>On a device signed in with the same Apple ID, tap the <strong>Restore Purchases</strong> (&#x27;구매 복원&#x27;) button on the game&#x27;s Settings screen. Consumable packs cannot be restored.</p>
<h3>How do I get a refund?</h3>
<p>Payments are processed by Apple, so please request refunds from Apple: <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a></p>
<h3>Will my progress move to a new device?</h3>
<p>No. Progress is stored only on your device and iCloud/Game Center are not used, so it cannot be transferred. Deleting the App deletes your progress. The Lifetime Pass can be recovered with Restore Purchases.</p>
<h3>Ads are not showing.</h3>
<p>Check your internet connection and try again later. Ads may be temporarily unavailable depending on region or time. Lifetime Pass holders do not see ad buttons.</p>
<h3>How do I change the language?</h3>
<p>The game follows your device&#x27;s language setting.</p>
